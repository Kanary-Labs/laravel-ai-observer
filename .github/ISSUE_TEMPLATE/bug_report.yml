name: Bug report
description: Report a reproducible problem with AI Observatory
title: '[Bug]: '
labels:
    - bug
body:
    - type: markdown
      attributes:
          value: |
              Thanks for helping improve AI Observatory. Remove prompts, responses, credentials, customer data, and other sensitive information before submitting.

    - type: input
      id: observatory_version
      attributes:
          label: AI Observatory version
          placeholder: '1.0.0'
      validations:
          required: true

    - type: input
      id: laravel_ai_version
      attributes:
          label: Laravel AI SDK version
          placeholder: '0.10.1'
      validations:
          required: true

    - type: input
      id: environment
      attributes:
          label: Environment
          description: Include PHP, Laravel, database, and recording-mode versions.
          placeholder: 'PHP 8.4, Laravel 12, PostgreSQL 16, recording mode: queue'
      validations:
          required: true

    - type: textarea
      id: problem
      attributes:
          label: Problem
          description: What happened, and what did you expect instead?
          placeholder: Describe the observed and expected behavior.
      validations:
          required: true

    - type: textarea
      id: reproduction
      attributes:
          label: Minimal reproduction
          description: Provide the smallest code sample or repository that reproduces the problem.
          placeholder: Include setup and exact steps.
      validations:
          required: true

    - type: textarea
      id: sanitized_output
      attributes:
          label: Sanitized output
          description: Add relevant exceptions, command output, or screenshots after removing sensitive data.
          render: shell

    - type: checkboxes
      id: confirmations
      attributes:
          label: Confirmation
          options:
              - label: I searched existing issues for duplicates.
                required: true
              - label: I removed secrets, prompts, responses, and personal or customer data.
                required: true
              - label: This is not a security vulnerability.
                required: true
