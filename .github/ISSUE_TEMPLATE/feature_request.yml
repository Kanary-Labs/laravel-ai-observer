name: Feature request
description: Suggest an improvement to AI Observatory
title: '[Feature]: '
labels:
    - enhancement
body:
    - type: markdown
      attributes:
          value: |
              Before proposing a feature, review the project scope and current documentation. Please explain the developer problem before describing a solution.

    - type: textarea
      id: problem
      attributes:
          label: Problem
          description: What developer workflow or observability problem needs improvement?
          placeholder: Describe the problem and who encounters it.
      validations:
          required: true

    - type: textarea
      id: proposal
      attributes:
          label: Proposed solution
          description: What behavior or API would address the problem?
      validations:
          required: true

    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives considered
          description: Describe workarounds or alternative designs you considered.

    - type: textarea
      id: context
      attributes:
          label: Additional context
          description: Add sanitized examples, mockups, or related links.

    - type: checkboxes
      id: confirmations
      attributes:
          label: Confirmation
          options:
              - label: I searched existing issues for similar requests.
                required: true
              - label: This request is for observability rather than a replacement AI framework.
                required: true
              - label: I have not included secrets, prompts, responses, or customer data.
                required: true
