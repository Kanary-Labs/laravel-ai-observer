name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12', '13']
        database: [sqlite, mysql, pgsql]

    services:
      mysql:
        image: ${{ matrix.database == 'mysql' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: ai_observatory
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:16' || '' }}
        env:
          POSTGRES_DB: ai_observatory
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      AI_OBSERVATORY_TEST_DB: ${{ matrix.database }}
      DB_DATABASE: ai_observatory
      DB_HOST: 127.0.0.1
      DB_PASSWORD: ${{ matrix.database == 'pgsql' && 'postgres' || '' }}
      DB_USERNAME: ${{ matrix.database == 'pgsql' && 'postgres' || 'root' }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mbstring, pdo_sqlite, pdo_mysql, pdo_pgsql

      - run: composer require --dev "orchestra/testbench:${{ matrix.laravel == '12' && '^10.6' || '^11.0' }}" --no-update

      - run: composer update --prefer-dist --no-interaction

      - run: composer test

  quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer install --prefer-dist --no-interaction

      - run: composer test:lint

      - run: composer test:types

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run test:format

      - run: npm run build

      - run: git diff --exit-code -- dist

  fresh-install:
    name: Fresh Laravel ${{ matrix.laravel }} installation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        laravel: ['12', '13']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, pdo_sqlite

      - run: composer install --prefer-dist --no-interaction

      - name: Install into a fresh application
        run: |
          composer create-project "laravel/laravel:^${{ matrix.laravel }}.0" /tmp/observatory-app --no-interaction
          cd /tmp/observatory-app
          composer config repositories.ai-observatory path "$GITHUB_WORKSPACE"
          composer require "kanary/laravel-ai-observatory:@dev" --dev --no-interaction
          touch database/database.sqlite
          php artisan ai-observatory:install --force
          php artisan migrate --force
          php artisan ai-observatory:status
          php artisan route:list --path=ai-observatory
