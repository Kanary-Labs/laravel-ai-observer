laravel: '@testbench'

providers:
  - Workbench\App\Providers\WorkbenchServiceProvider

migrations:
  - database/migrations

workbench:
  start: '/ai-observatory/traces'
  install: true
  health: false
  discovers:
    web: true
    api: false
    commands: true
    components: false
    factories: false
    views: false
  build:
    - asset-publish
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
  assets:
    - laravel-assets
